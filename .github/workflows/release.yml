name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  BIN_NAME: aven

jobs:
  # Fails before the builds when the protected signing environment is incomplete.
  signing-preflight:
    runs-on: ubuntu-latest
    environment: macos-signing
    steps:
      - name: Check macOS signing secrets
        env:
          APPLE_DEVELOPER_ID_CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_DEVELOPER_ID_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY }}
        run: |
          missing=0
          for name in APPLE_DEVELOPER_ID_CERT_BASE64 APPLE_DEVELOPER_ID_CERT_PASSWORD APPLE_DEVELOPER_ID_IDENTITY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in the macos-signing environment"
              missing=1
            fi
          done
          exit "$missing"

  build:
    needs: signing-preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: aven-darwin-arm64
            use_cross: false
          - os: macos-15
            target: x86_64-apple-darwin
            artifact: aven-darwin-amd64
            use_cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: aven-linux-amd64
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: aven-linux-arm64
            use_cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172
        with:
          tool: cross@0.2.5
          fallback: none
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: |
          if [ "${{ matrix.use_cross }}" == "true" ]; then
            cross build --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi
      # Signing runs in sign-macos, which never executes build scripts.
      - name: Upload unsigned macOS binary
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ env.BIN_NAME }}
          if-no-files-found: error
      - name: Package
        if: runner.os != 'macOS'
        run: |
          bin="target/${{ matrix.target }}/release/${BIN_NAME}"
          tar -C "$(dirname "$bin")" -czf "${{ matrix.artifact }}.tar.gz" "$BIN_NAME"
          shasum -a 256 "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.sha256"
      - name: Smoke test packaged binary
        if: runner.os != 'macOS' && matrix.target != 'aarch64-unknown-linux-musl'
        run: |
          package_dir="package-${{ matrix.artifact }}"
          mkdir "$package_dir"
          tar -xzf ${{ matrix.artifact }}.tar.gz -C "$package_dir"
          "$package_dir/${BIN_NAME}" --help
      - uses: actions/upload-artifact@v7
        if: runner.os != 'macOS'
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.sha256

  # Runs no cargo or build scripts. The signing script removes the imported key
  # before package validation and binary smoke tests; GitHub actions are pinned.
  sign-macos:
    needs: build
    runs-on: macos-15
    environment: macos-signing
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: aven-darwin-arm64
            architecture: arm64
          - artifact: aven-darwin-amd64
            architecture: x86_64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: unsigned-${{ matrix.artifact }}
          path: unsigned
      - name: Sign
        env:
          APPLE_DEVELOPER_ID_CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_DEVELOPER_ID_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY }}
        run: |
          chmod 755 "unsigned/${BIN_NAME}"
          scripts/sign-macos-release "unsigned/${BIN_NAME}"
      - name: Package
        run: |
          tar -C unsigned -czf "${{ matrix.artifact }}.tar.gz" "$BIN_NAME"
          shasum -a 256 "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.sha256"
      - name: Smoke test packaged binary
        run: |
          package_dir="package-${{ matrix.artifact }}"
          mkdir "$package_dir"
          shasum -a 256 -c "${{ matrix.artifact }}.sha256"
          tar -xzf "${{ matrix.artifact }}.tar.gz" -C "$package_dir"
          cmp "unsigned/${BIN_NAME}" "$package_dir/${BIN_NAME}"
          scripts/verify-macos-release "$package_dir/${BIN_NAME}" "${{ matrix.architecture }}"
          scripts/test-verify-macos-release "$package_dir/${BIN_NAME}"
          "$package_dir/${BIN_NAME}" --help </dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.sha256

  release:
    needs: [build, sign-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: aven-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          generate_release_notes: true
          files: |
            *.tar.gz
            *.sha256

  update-tap:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: aven-*
          merge-multiple: true
      - uses: actions/checkout@v5
        with:
          repository: raine/homebrew-aven
          token: ${{ secrets.RELEASE_TOKEN }}
          path: tap
      - name: Generate formula and push to tap
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          SHA_MAC_ARM=$(awk '{print $1}' aven-darwin-arm64.sha256)
          SHA_MAC_INTEL=$(awk '{print $1}' aven-darwin-amd64.sha256)
          SHA_LINUX_ARM=$(awk '{print $1}' aven-linux-arm64.sha256)
          SHA_LINUX_INTEL=$(awk '{print $1}' aven-linux-amd64.sha256)

          cat > tap/Formula/aven.rb << EOF
          class Aven < Formula
            desc "Local-first task manager CLI and sync server"
            homepage "https://github.com/raine/aven"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/raine/aven/releases/download/v${VERSION}/aven-darwin-arm64.tar.gz"
                sha256 "${SHA_MAC_ARM}"
              else
                url "https://github.com/raine/aven/releases/download/v${VERSION}/aven-darwin-amd64.tar.gz"
                sha256 "${SHA_MAC_INTEL}"
              end
            end

            on_linux do
              if Hardware::CPU.arm? && Hardware::CPU.is_64_bit?
                url "https://github.com/raine/aven/releases/download/v${VERSION}/aven-linux-arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM}"
              else
                url "https://github.com/raine/aven/releases/download/v${VERSION}/aven-linux-amd64.tar.gz"
                sha256 "${SHA_LINUX_INTEL}"
              end
            end

            def install
              bin.install "aven"
            end

            test do
              assert_match "Local-first task manager", shell_output("#{bin}/aven --help")
            end
          end
          EOF
          sed -i 's/^          //' tap/Formula/aven.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/aven.rb
          if git diff --cached --quiet; then
            echo "Formula is up to date"
          else
            git commit -m "aven ${VERSION}"
            git pull --rebase
            git push
          fi
