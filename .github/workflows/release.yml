name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  BIN_NAME: aven

jobs:
  # Fails before the builds when the protected signing environment is incomplete.
  signing-preflight:
    runs-on: ubuntu-latest
    environment: macos-signing
    steps:
      - name: Check macOS signing and notarization secrets
        env:
          APPLE_DEVELOPER_ID_CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_DEVELOPER_ID_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=0
          for name in APPLE_DEVELOPER_ID_CERT_BASE64 APPLE_DEVELOPER_ID_CERT_PASSWORD APPLE_DEVELOPER_ID_IDENTITY \
            ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in the macos-signing environment"
              missing=1
            fi
          done
          exit "$missing"

  build:
    needs: signing-preflight
    strategy:
      fail-fast: false
      matrix:
        # Terminal-only builds publish under aven-{darwin,linux}-*, Desktop
        # builds under aven-desktop-*: macOS builds both per architecture,
        # Linux builds musl terminal and glibc Desktop archives.
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: aven-darwin-arm64
            use_cross: false
          - os: macos-15
            target: x86_64-apple-darwin
            artifact: aven-darwin-amd64
            use_cross: false
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: aven-desktop-darwin-arm64
            features: desktop
            use_cross: false
          - os: macos-15
            target: x86_64-apple-darwin
            artifact: aven-desktop-darwin-amd64
            features: desktop
            use_cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: aven-linux-amd64
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: aven-linux-arm64
            use_cross: true
          # Linux Desktop needs glibc: GPUI loads the system's Vulkan, EGL and
          # Wayland libraries. Building on Ubuntu 22.04 sets the glibc floor
          # at 2.35; scripts/check-linux-desktop-release enforces it.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: aven-desktop-linux-amd64
            features: desktop
            use_cross: false
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: aven-desktop-linux-arm64
            features: desktop
            use_cross: false
    runs-on: ${{ matrix.os }}
    # One codegen unit shrinks shipped binaries by about a quarter at the cost
    # of slower compilation; local release builds keep Cargo's default.
    # cross forwards CARGO_* variables into its container.
    env:
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172
        with:
          tool: cross@0.2.5
          fallback: none
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.artifact }}
      - name: Install GPUI build libraries
        if: runner.os == 'Linux' && matrix.features == 'desktop'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libfreetype-dev libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev
      - name: Build
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          if [ "${{ matrix.use_cross }}" == "true" ]; then
            cross build --release --locked --target "${{ matrix.target }}"
          elif [ "$RUNNER_OS" == macOS ] && [ -n "$FEATURES" ]; then
            # Aven Desktop requires macOS 13; terminal-only keeps the default.
            MACOSX_DEPLOYMENT_TARGET=13.0 \
              cargo build --release --locked --target "${{ matrix.target }}" --features "$FEATURES"
          elif [ -n "$FEATURES" ]; then
            cargo build --release --locked --target "${{ matrix.target }}" --features "$FEATURES"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi
      # Signing runs in sign-macos, which never executes build scripts.
      - name: Upload unsigned macOS binary
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ env.BIN_NAME }}
          if-no-files-found: error
      - name: Package
        if: runner.os != 'macOS'
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          bin="target/${{ matrix.target }}/release/${BIN_NAME}"
          if [ -n "$FEATURES" ]; then
            scripts/package-linux-desktop "$bin" "${{ matrix.artifact }}.tar.gz"
          else
            tar -C "$(dirname "$bin")" -czf "${{ matrix.artifact }}.tar.gz" "$BIN_NAME"
          fi
          shasum -a 256 "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.sha256"
      - name: Smoke test packaged binary
        if: runner.os != 'macOS' && matrix.features != 'desktop' && matrix.target != 'aarch64-unknown-linux-musl'
        run: |
          package_dir="package-${{ matrix.artifact }}"
          mkdir "$package_dir"
          tar -xzf ${{ matrix.artifact }}.tar.gz -C "$package_dir"
          "$package_dir/${BIN_NAME}" --help
      - name: Install Linux Desktop smoke test tools
        if: runner.os == 'Linux' && matrix.features == 'desktop'
        run: sudo apt-get install -y binutils dbus desktop-file-utils python3 x11-utils xvfb libegl1 libgl1-mesa-dri fonts-dejavu-core
      - name: Smoke test Linux Desktop archive and installer
        if: runner.os == 'Linux' && matrix.features == 'desktop'
        run: |
          sha256sum -c "${{ matrix.artifact }}.sha256"
          target="${{ matrix.target }}"
          scripts/check-linux-desktop-release "${{ matrix.artifact }}.tar.gz" "${target%%-*}"
      - uses: actions/upload-artifact@v7
        if: runner.os != 'macOS'
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.sha256

  # Runs no cargo or build scripts. The signing and notarization scripts remove
  # the imported key and API key before package validation and smoke tests;
  # GitHub actions are pinned.
  sign-macos:
    needs: build
    runs-on: macos-15
    environment: macos-signing
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: aven-darwin-arm64
            channel: terminal
            architecture: arm64
          - artifact: aven-darwin-amd64
            channel: terminal
            architecture: x86_64
          - artifact: aven-desktop-darwin-arm64
            channel: desktop
            architecture: arm64
            dmg: Aven-arm64
          - artifact: aven-desktop-darwin-amd64
            channel: desktop
            architecture: x86_64
            dmg: Aven-amd64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: unsigned-${{ matrix.artifact }}
          path: unsigned
      # The bundle copies the unsigned binary, so both are signed from the same bytes.
      - name: Assemble Aven.app
        run: |
          version=$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          mkdir unsigned-app
          scripts/assemble-macos-app "unsigned/${BIN_NAME}" "$version" unsigned-app "${{ matrix.channel }}"
      # Desktop ships only the bundle; terminal-only also ships the bare binary.
      - name: Sign
        env:
          APPLE_DEVELOPER_ID_CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_DEVELOPER_ID_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY }}
        run: |
          chmod 755 "unsigned/${BIN_NAME}"
          if [[ "${{ matrix.channel }}" == terminal ]]; then
            scripts/sign-macos-release "unsigned/${BIN_NAME}" unsigned-app/Aven.app
          else
            scripts/sign-macos-release unsigned-app/Aven.app
          fi
      # Staples the app; the bare binary's ticket is found online by Gatekeeper.
      - name: Notarize
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [[ "${{ matrix.channel }}" == terminal ]]; then
            scripts/notarize-macos-release "unsigned/${BIN_NAME}" unsigned-app/Aven.app
          else
            scripts/notarize-macos-release unsigned-app/Aven.app
          fi
      # The image holds the stapled app, so it installs offline without prompts.
      - name: Create disk image
        if: matrix.channel == 'desktop'
        run: |
          mkdir dmg
          scripts/create-macos-dmg unsigned-app/Aven.app "dmg/${{ matrix.dmg }}.dmg"
      - name: Sign disk image
        if: matrix.channel == 'desktop'
        env:
          APPLE_DEVELOPER_ID_CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_DEVELOPER_ID_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY }}
        run: scripts/sign-macos-release "dmg/${{ matrix.dmg }}.dmg"
      - name: Notarize disk image
        if: matrix.channel == 'desktop'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: scripts/notarize-macos-release "dmg/${{ matrix.dmg }}.dmg"
      - name: Package
        run: |
          mkdir dist
          if [[ "${{ matrix.channel }}" == terminal ]]; then
            scripts/package-macos-binary "unsigned/${BIN_NAME}" "dist/${{ matrix.artifact }}.tar.gz"
          else
            mv "dmg/${{ matrix.dmg }}.dmg" dist/
          fi
          tar --no-mac-metadata -C unsigned-app -czf "dist/${{ matrix.artifact }}-app.tar.gz" Aven.app
          cd dist
          for archive in *; do
            shasum -a 256 "$archive" > "${archive%%.*}.sha256"
          done
          ls -l
      # `aven update` in every installed version refuses larger archives.
      - name: Check archive sizes
        if: matrix.channel == 'terminal'
        run: |
          for archive in "dist/${{ matrix.artifact }}.tar.gz" "dist/${{ matrix.artifact }}-app.tar.gz"; do
            if (( $(stat -f %z "$archive") > 64 * 1024 * 1024 )); then
              echo "::error::$archive exceeds the 64 MiB update limit"
              exit 1
            fi
          done
      - name: Smoke test packaged binary
        if: matrix.channel == 'terminal'
        run: |
          package_dir="package-${{ matrix.artifact }}"
          mkdir "$package_dir"
          (cd dist && shasum -a 256 -c "${{ matrix.artifact }}.sha256")
          # macOS tar hides AppleDouble ._ entries when listing; the updater does not.
          entries=$(python3 -I -c 'import sys, tarfile
          for m in tarfile.open(sys.argv[1]):
              print("file" if m.isreg() else "other", m.name)' "dist/${{ matrix.artifact }}.tar.gz")
          if [[ $entries != "file $BIN_NAME" ]]; then
            echo "::error::bare archive must contain only $BIN_NAME"
            exit 1
          fi
          tar -xzf "dist/${{ matrix.artifact }}.tar.gz" -C "$package_dir"
          cmp "unsigned/${BIN_NAME}" "$package_dir/${BIN_NAME}"
          scripts/verify-macos-release "$package_dir/${BIN_NAME}" "${{ matrix.architecture }}"
          scripts/test-verify-macos-release "$package_dir/${BIN_NAME}"
          "$package_dir/${BIN_NAME}" --help </dev/null
      - name: Smoke test packaged app
        run: |
          package_dir="package-${{ matrix.artifact }}-app"
          mkdir "$package_dir"
          (cd dist && shasum -a 256 -c "${{ matrix.artifact }}-app.sha256")
          if tar -tzf "dist/${{ matrix.artifact }}-app.tar.gz" | grep -v '^Aven\.app/'; then
            echo "::error::app archive contains entries outside Aven.app/"
            exit 1
          fi
          tar -xzf "dist/${{ matrix.artifact }}-app.tar.gz" -C "$package_dir"
          diff -r unsigned-app/Aven.app "$package_dir/Aven.app"
          scripts/verify-macos-release "$package_dir/Aven.app" "${{ matrix.architecture }}"
          scripts/test-verify-macos-release "$package_dir/Aven.app"
          scripts/stapler validate "$package_dir/Aven.app"
          if ! spctl --assess --type execute --verbose=4 "$package_dir/Aven.app" >spctl.log 2>&1; then
            cat spctl.log
            exit 1
          fi
          cat spctl.log
          grep -qx 'source=Notarized Developer ID' spctl.log
          ln -s "$PWD/$package_dir/Aven.app/Contents/MacOS/${BIN_NAME}" "$package_dir/${BIN_NAME}"
          "$package_dir/${BIN_NAME}" --help </dev/null
      - name: Smoke test disk image
        if: matrix.channel == 'desktop'
        run: |
          dmg="dist/${{ matrix.dmg }}.dmg"
          (cd dist && shasum -a 256 -c "${{ matrix.dmg }}.sha256")
          scripts/test-verify-macos-release "$dmg"
          scripts/stapler validate "$dmg"
          if ! spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg" >spctl.log 2>&1; then
            cat spctl.log
            exit 1
          fi
          cat spctl.log
          grep -qx 'source=Notarized Developer ID' spctl.log
          scripts/check-macos-dmg "$dmg" unsigned-app/Aven.app
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  release:
    needs: [build, sign-macos]
    # Hyphenated tags such as v1.2.3-signtest.1 build and sign without publishing.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: aven-*
          merge-multiple: true
      - name: Assemble Nix release flake
        env:
          VERSION: ${{ github.ref_name }}
        run: scripts/assemble-nix-release "$VERSION" . aven-nix.tar.gz
      - uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          generate_release_notes: true
          files: |
            *.tar.gz
            *.dmg
            *.sha256

  update-tap:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: aven-*
          merge-multiple: true
      - uses: actions/checkout@v5
        with:
          repository: raine/homebrew-aven
          token: ${{ secrets.RELEASE_TOKEN }}
          path: tap
      - uses: actions/checkout@v5
        with:
          path: source
          persist-credentials: false
      - name: Generate formula and cask and push to tap
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          source/scripts/homebrew-formula "$VERSION" . > tap/Formula/aven.rb
          mkdir -p tap/Casks
          source/scripts/homebrew-cask "$VERSION" . > tap/Casks/aven.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/aven.rb Casks/aven.rb
          if git diff --cached --quiet; then
            echo "Formula and cask are up to date"
          else
            git commit -m "aven ${VERSION}"
            git pull --rebase
            git push
          fi

  nix-verify:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: cachix/install-nix-action@v31
      - name: Build published Nix release flake
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          nix build --print-build-logs \
            "https://github.com/raine/aven/releases/download/$VERSION/aven-nix.tar.gz"
          [[ "$(./result/bin/aven --version)" == "aven ${VERSION#v}" ]]

  container-verify:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: aven-linux-*
          merge-multiple: true
          path: packages
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Assemble and verify release images
        env:
          VERSION: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
        run: |
          mkdir -p release-bin images
          for arch in amd64 arm64; do
            (cd packages && sha256sum -c "aven-linux-$arch.sha256")
            mkdir -p "release-bin/linux-$arch"
            tar -xzf "packages/aven-linux-$arch.tar.gz" -C "release-bin/linux-$arch"
            docker buildx build --load --platform "linux/$arch" --target release \
              --build-context release-bin=./release-bin \
              --label "org.opencontainers.image.version=${VERSION#v}" \
              --label "org.opencontainers.image.revision=$REVISION" \
              -t "aven:release-$arch" .
            scripts/test-container-image "aven:release-$arch" "linux/$arch"
            docker save "aven:release-$arch" | gzip > "images/$arch.tar.gz"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: container-images
          path: images/*.tar.gz
          if-no-files-found: error
          retention-days: 3

  container-publish:
    needs: [release, container-verify]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    concurrency:
      group: aven-container-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: container-images
          path: images
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Publish tested images and verify version manifest
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          image=ghcr.io/raine/aven
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          for arch in amd64 arm64; do
            docker load -i "images/$arch.tar.gz"
            docker tag "aven:release-$arch" "$image:$version-$arch"
            docker push "$image:$version-$arch"
          done
          docker buildx imagetools create -t "$image:$version" \
            "$image:$version-amd64" "$image:$version-arm64"
          docker buildx imagetools inspect --raw "$image:$version" > manifest.json
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' manifest.json
          for arch in amd64 arm64; do
            docker pull --platform "linux/$arch" "$image:$version"
            scripts/test-container-image "$image:$version" "linux/$arch"
          done
          # An older release rerun must not move latest backwards.
          latest_release="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [[ "$latest_release" == "$VERSION" ]]; then
            docker buildx imagetools create -t "$image:latest" "$image:$version"
          fi
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
