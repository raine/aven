name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Full checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install prebuilt tools
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172
        with:
          tool: cargo-deny@0.20.2,cargo-machete@0.9.2,cargo-nextest@0.9.146,just@1.58.0
          fallback: none
      - name: Install source-only tools
        run: |
          cargo install checkle --version '=0.1.2' --locked
          cargo install sqlx-cli --version '=0.9.0' --locked
      - name: Check SQLx metadata
        run: just sqlx-check
      - name: Run full checks
        env:
          WM_TARGET_BRANCH: HEAD
        run: just check-ci

  shell-fixtures:
    name: Public shell fixtures (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux shell tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bash jq ruby shellcheck util-linux
      - name: Install macOS shell tools
        if: runner.os == 'macOS'
        run: brew install bash jq ruby shellcheck
      - name: Check public shell scripts
        run: shellcheck scripts/process-lock scripts/test-process-lock scripts/test-pre-commit scripts/test-workmux-environment hooks/pre-commit
      - name: Run public shell fixtures
        run: |
          scripts/test-process-lock
          scripts/test-pre-commit
          scripts/test-workmux-environment
