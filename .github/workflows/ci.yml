name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Full checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install prebuilt tools
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172
        with:
          tool: cargo-deny@0.20.2,cargo-machete@0.9.2,cargo-nextest@0.9.146,just@1.58.0
          fallback: none
      - name: Install source-only tools
        run: |
          cargo install checkle --version '=0.1.2' --locked
          cargo install sqlx-cli --version '=0.9.0' --locked
      - name: Check dependency advisories and licenses
        run: checkle run cargo-deny
      - name: Check SQLx metadata
        run: just sqlx-check
      - name: Run full checks
        env:
          WM_TARGET_BRANCH: HEAD
        run: just check-ci

  desktop:
    name: Desktop app
    runs-on: macos-latest
    env:
      SQLX_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked -p aven-desktop
      - name: Check the shipped build
        run: cargo check --locked -p aven --features desktop

  desktop-linux:
    name: Desktop app (Linux)
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@v5
      - name: Install GPUI build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libfreetype-dev libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: cargo clippy --locked -p aven -p aven-desktop --features aven/desktop --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked -p aven-desktop

  shell-fixtures:
    name: Public shell fixtures (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux shell tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bash jq ruby shellcheck util-linux
      - name: Install macOS shell tools
        if: runner.os == 'macOS'
        run: brew install bash jq ruby shellcheck
      - name: Check public shell scripts
        run: shellcheck scripts/process-lock scripts/test-process-lock scripts/test-pre-commit scripts/test-workmux-environment scripts/test-container-image hooks/pre-commit scripts/assemble-macos-app scripts/test-assemble-macos-app scripts/package-macos-binary scripts/test-package-macos-binary scripts/sign-macos-release scripts/verify-macos-release scripts/test-verify-macos-release scripts/install scripts/test-install scripts/homebrew-formula scripts/test-homebrew-formula scripts/homebrew-cask scripts/test-homebrew-cask scripts/notarize-macos-release scripts/create-macos-dmg scripts/check-macos-dmg scripts/test-create-macos-dmg scripts/generate-macos-dmg-layout scripts/package-linux-desktop scripts/check-linux-desktop-release scripts/install-desktop scripts/test-install-desktop
      - name: Run public shell fixtures
        run: |
          scripts/test-process-lock
          scripts/test-pre-commit
          scripts/test-workmux-environment
          scripts/test-install
          scripts/test-install-desktop
          scripts/test-homebrew-formula
          scripts/test-homebrew-cask
      - name: Run macOS app bundle fixtures
        if: runner.os == 'macOS'
        run: |
          scripts/test-assemble-macos-app
          scripts/test-package-macos-binary
          scripts/test-create-macos-dmg
