[workspace]
members = [".", "crates/aven-core", "crates/aven-uniffi"]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
flate2 = "1.1"
hex = "0.4"
image = { version = "=0.25.9", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
oxipng = { version = "10.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tar = "0.4"
tempfile = "3.14"
tokio = { version = "1.45", features = ["macros", "sync", "time"] }
tracing = "0.1"
url = "2.5"
zstd = "0.13"

[package]
name = "aven"
version = "0.1.27"
edition = "2024"
rust-version = "1.96"
authors = ["Raine"]
description = "Local-first task manager CLI and sync server"
repository = "https://github.com/raine/aven"
license = "MIT"

[dependencies]
aven-core = { path = "crates/aven-core", version = "=0.1.22" }
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
hex.workspace = true
image.workspace = true
iana-time-zone = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip", "brotli", "zstd", "deflate"] }
tower-http = { version = "0.7", features = ["compression-full", "decompression-full"] }
flate2.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
semver = { version = "1.0", features = ["serde"] }
tar.workspace = true
tempfile.workspace = true
anyhow.workspace = true
base64 = "0.22"
chrono.workspace = true
chrono-tz.workspace = true
crossterm = "0.29"
pulldown-cmark = "0.13"
ratatui = "0.30"
sha2.workspace = true
similar = "3.1"
time = { version = "0.3", features = ["formatting", "local-offset", "macros", "parsing"] }
tokio = { workspace = true, features = ["io-util", "process", "rt-multi-thread", "signal", "net"] }
unicode-width = "0.2"
url.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4"

[dev-dependencies]
aven-core = { path = "crates/aven-core", version = "=0.1.22", features = ["test-support"] }
oxipng.workspace = true
sqlx.workspace = true
zstd.workspace = true

[patch.crates-io]
crossterm = { git = "https://github.com/raine/crossterm", rev = "f99eeae405e28fa8cb353a6c6e36c493e72891bd" }

[[bench]]
name = "sync_scaling"
harness = false
