[workspace]
members = [".", "crates/aven-core", "crates/aven-uniffi"]
resolver = "3"

[package]
name = "aven"
version = "0.1.19"
edition = "2024"
rust-version = "1.96"
authors = ["Raine"]
description = "Local-first task manager CLI and sync server"
repository = "https://github.com/raine/aven"
license = "MIT"

[dependencies]
aven-core = { path = "crates/aven-core", version = "=0.1.16" }
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
hex = "0.4"
image = { version = "=0.25.9", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip", "brotli", "zstd", "deflate"] }
tower-http = { version = "0.7", features = ["compression-full", "decompression-full"] }
flate2 = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
semver = { version = "1.0", features = ["serde"] }
tar = "0.4"
tempfile = "3.14"
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossterm = "0.29"
pulldown-cmark = "0.13"
ratatui = "0.30"
sha2 = "0.11"
similar = "3.1"
time = { version = "0.3", features = ["formatting", "local-offset", "macros", "parsing"] }
tokio = { version = "1.45", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "net", "sync", "time"] }
unicode-width = "0.2"
url = "2.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4"

[dev-dependencies]
aven-core = { path = "crates/aven-core", version = "=0.1.16", features = ["test-support"] }
oxipng = { version = "10.1", default-features = false }
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "macros",
  "migrate",
] }
zstd = "0.13"

[patch.crates-io]
crossterm = { git = "https://github.com/raine/crossterm" }
