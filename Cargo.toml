[workspace]
members = [".", "crates/aven-core"]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
flate2 = "1.1"
hex = "0.4"
image = { version = "=0.25.9", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
hkdf = "0.13"
oxipng = { version = "10.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "macros", "migrate"] }
tar = "0.4"
tempfile = "3.14"
tokio = { version = "1.45", features = ["macros", "sync", "time"] }
tracing = "0.1"
url = "2.5"
zeroize = "1.8"
zstd = "0.13"

[package]
name = "aven"
version = "0.1.41"
edition = "2024"
rust-version = "1.96"
authors = ["Raine"]
description = "Local-first task manager CLI and sync server"
repository = "https://github.com/raine/aven"
license = "MIT"

[dependencies]
aven-core = { path = "crates/aven-core", version = "=0.1.32" }
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
getrandom = "0.4"
hex.workspace = true
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "server", "server-graceful", "service", "tokio"] }
image.workspace = true
iana-time-zone = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
flate2.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
semver = { version = "1.0", features = ["serde"] }
tar.workspace = true
tempfile.workspace = true
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
crossterm = "0.29"
pulldown-cmark = "0.13"
ratatui = "0.30"
sha2.workspace = true
similar = "3.1"
time = { version = "0.3", features = ["formatting", "local-offset", "macros", "parsing"] }
tokio = { workspace = true, features = ["io-util", "process", "rt-multi-thread", "signal", "net"] }
unicode-width = "0.2"
url.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize.workspace = true
qrcode = { version = "0.14.1", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"
security-framework = { version = "3.7", default-features = false }
security-framework-sys = { version = "2.15", default-features = false }

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
aven-core = { path = "crates/aven-core", version = "=0.1.32", features = ["test-support"] }
zstd.workspace = true

[target.'cfg(target_os = "ios")'.dev-dependencies]
sqlx = { workspace = true, features = ["sqlite-unbundled"] }

[target.'cfg(not(target_os = "ios"))'.dev-dependencies]
sqlx = { workspace = true, features = ["sqlite"] }

[patch.crates-io]
crossterm = { git = "https://github.com/raine/crossterm", rev = "f99eeae405e28fa8cb353a6c6e36c493e72891bd" }

[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.test]
debug = 1

[profile.test.package."*"]
opt-level = 2
debug = false
