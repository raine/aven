files:
  symlink:
    - CLAUDE.local.md
    - .env
    - history
  copy:
    - .envrc

post_create:
  - |
    set -euo pipefail
    direnv allow
    src="${AVEN_DB:-$HOME/.local/state/aven/db.sqlite}"
    dest="$WM_WORKTREE_PATH/.aven/db.sqlite"
    env_file="$WM_WORKTREE_PATH/.aven/worktree.env"
    envrc="$WM_WORKTREE_PATH/.envrc"
    source_line="source_env_if_exists .aven/worktree.env"
    mkdir -p "$(dirname "$dest")"
    if [ ! -e "$dest" ] && [ -e "$src" ]; then
      sqlite3 "$src" ".backup '$dest'"
    fi
    printf "export AVEN_DEV_DB=%q\nexport AVEN_SYNC_DISABLED=1\n" "$dest" > "$env_file"
    grep -Fqx "$source_line" "$envrc" || printf "\n%s\n" "$source_line" >> "$envrc"
    direnv allow "$WM_WORKTREE_PATH" >/dev/null 2>&1 || true

pre_merge:
  - just pre-merge
