[graph]
all-features = true
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # notify-rust requires zbus 5; these crates are folded into zbus 6.
    # https://github.com/z-galaxy/zbus/issues/2043
    { id = "RUSTSEC-2026-0370", reason = "zvariant is required by notify-rust's zbus 5 backend" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names is required by notify-rust's zbus 5 backend" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is required by notify-rust's zbus 5 backend" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
skip = [
    # SQLx 0.9 requires sha2 0.10; the application's crypto uses sha2 0.11.
    { name = "sha2", version = "=0.10.9" },
    { name = "digest", version = "=0.10.7" },
    { name = "block-buffer", version = "=0.10.4" },
    { name = "crypto-common", version = "=0.1.6" },
    { name = "cpufeatures", version = "=0.2.17" },
    # SQLx, hashlink, and kasuari require hashbrown 0.16; Ratatui uses 0.17.
    { name = "hashbrown", version = "=0.16.1" },
    # Derive macros require syn 2; async-trait and serde_repr require syn 3.
    { name = "syn", version = "=2.0.119" },
    # Proptest's rand 0.9 requires getrandom 0.3; the application uses 0.4.
    { name = "getrandom", version = "=0.3.4" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/raine/crossterm"]
