[package]
name = "aven-core"
version = "0.1.32"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "Core library for the Aven local-first task manager"
repository = "https://github.com/raine/aven"
build = "build.rs"

[features]
test-support = []

[dependencies]
anyhow.workspace = true
chacha20poly1305.workspace = true
chacha20 = { version = "=0.10.2", default-features = false, features = ["rng", "zeroize"] }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
hpke = { version = "=0.14.1", default-features = false, features = ["alloc", "x25519", "chacha"] }
rand_core = "=0.10.1"
subtle = "2.6"
chrono = { workspace = true, features = ["serde"] }
chrono-tz.workspace = true
getrandom = "0.4"
hex.workspace = true
hkdf.workspace = true
image.workspace = true
oxipng.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tar.workspace = true
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true
url.workspace = true
zeroize.workspace = true
zstd.workspace = true

# Both devices and simulators use Apple's SQLite; other targets retain the bundle.
[target.'cfg(target_os = "ios")'.dependencies]
sqlx = { workspace = true, features = ["sqlite-unbundled"] }

[target.'cfg(not(target_os = "ios"))'.dependencies]
sqlx = { workspace = true, features = ["sqlite"] }

[dev-dependencies]
aven-core = { path = ".", features = ["test-support"] }
tempfile.workspace = true
