[package]
name = "aven-core"
version = "0.1.12"
edition = "2024"
rust-version = "1.96"
license = "MIT"
build = "build.rs"

[features]
test-support = []

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
flate2 = "1.1"
getrandom = "0.4"
hex = "0.4"
image = { version = "=0.25.9", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
oxipng = { version = "10.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tempfile = "3.14"
tar = "0.4"
tokio = { version = "1.45", features = ["macros", "rt", "sync"] }
tracing = "0.1"
url = "2.5"
zstd = "0.13"

[dev-dependencies]
tempfile = "3.14"
