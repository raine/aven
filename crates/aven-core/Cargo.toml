[package]
name = "aven-core"
version = "0.1.12"
edition = "2024"
rust-version = "1.96"
license = "MIT"
build = "build.rs"

[features]
test-support = []

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { version = "1.45", features = ["macros", "rt", "sync"] }
tracing = "0.1"
url = "2.5"

[dev-dependencies]
tempfile = "3.14"
