[package]
name = "aven-core"
version = "0.1.33"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "Core library for the Aven local-first task manager"
repository = "https://github.com/raine/aven"
build = "build.rs"

[features]
test-support = ["aven-protocol/test-support"]

[dependencies]
aven-protocol = { path = "../aven-protocol", version = "=0.1.0" }
anyhow.workspace = true
base64.workspace = true
chacha20poly1305.workspace = true
ed25519-dalek.workspace = true
chrono = { workspace = true, features = ["serde"] }
chrono-tz.workspace = true
getrandom.workspace = true
hex.workspace = true
hkdf.workspace = true
image.workspace = true
oxipng.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tar.workspace = true
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true
url.workspace = true
zeroize.workspace = true
zstd.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Both devices and simulators use Apple's SQLite; other targets retain the bundle.
[target.'cfg(target_os = "ios")'.dependencies]
sqlx = { workspace = true, features = ["sqlite-unbundled"] }

[target.'cfg(not(target_os = "ios"))'.dependencies]
sqlx = { workspace = true, features = ["sqlite"] }

[dev-dependencies]
aven-core = { path = ".", features = ["test-support"] }
tracing-subscriber = "0.3"
