# Named scenes rendered by both sides. See README.md for the tolerance policy.
target = "history/2026-10-31-phased-gpui-desktop/target/prototype-v3.html"

[tolerance]
default_px = 1.0

[[element]]
name = "app"
selector = ".app"

[[element]]
name = "nav"
selector = ".nav"

[[element]]
name = "main"
selector = ".main"

[[element]]
name = "main-header"
selector = ".main-h"

[[element]]
name = "list"
selector = ".list"

[[element]]
name = "detail"
selector = ".detail"

[[element]]
name = "section-0"
selector = ".list .sect"
index = 0

[[element]]
name = "section-1"
selector = ".list .sect"
index = 1

[[element]]
name = "row-0"
selector = ".list .row"
index = 0

[[element]]
name = "row-1"
selector = ".list .row"
index = 1

[[element]]
name = "row-2"
selector = ".list .row"
index = 2

[[element]]
name = "row-8"
selector = ".list .row"
index = 8

[[element]]
name = "row-11"
selector = ".list .row"
index = 11

[[element]]
name = "row-18"
selector = ".list .row"
index = 18

[[scene]]
name = "queue-dark"
theme = "dark"
width = 1440
height = 900
measure = ["app", "nav", "main", "main-header", "list", "detail", "section-0", "section-1", "row-0", "row-1", "row-2", "row-8", "row-11", "row-18"]

[[scene]]
name = "queue-light"
theme = "light"
width = 1440
height = 900
measure = ["app", "nav", "main", "main-header", "list", "detail", "section-0", "section-1", "row-0", "row-1", "row-2", "row-8", "row-11", "row-18"]

[[scene]]
name = "queue-narrow"
theme = "dark"
width = 960
height = 600
measure = ["app", "nav", "main", "main-header", "list", "section-0", "row-0", "row-1", "row-8", "row-11"]
absent = ["detail"]

[[scene]]
name = "queue-completed"
theme = "dark"
width = 1440
height = 900
gpui_keys = ["d", "j j j j j j j j j j j j j j j j j j j j j j j j j j j j j j j j j j j j j j j j"]
prototype_steps = ["setStatus('done')", "mount()", "document.querySelector('.list').scrollTop = 1e6"]
measure = ["app", "nav", "main", "main-header", "list", "detail"]

[[scene]]
name = "queue-moving"
theme = "dark"
width = 1440
height = 900
gpui_keys = ["d"]
gpui_frame_ms = 60
prototype_steps = ["setStatus('done')", "mount()"]
measure = ["app", "nav", "main", "main-header", "list", "detail"]

[[scene]]
name = "queue-hover-below-selection"
theme = "dark"
width = 1440
height = 900
gpui_pointer = [600.0, 133.0]
measure = ["app", "nav", "main", "main-header", "list", "detail"]

[[scene]]
name = "views"
theme = "dark"
width = 1440
height = 900
gpui_keys = ["v y"]
prototype_steps = ["state.view='ready'", "mount()"]
measure = ["app", "nav", "main", "main-header"]

[[scene]]
name = "views-recent"
theme = "dark"
width = 1440
height = 900
gpui_keys = ["v r"]
prototype_steps = ["state.view='recent'", "mount()"]
measure = ["app", "nav", "main", "main-header"]

[[scene]]
name = "views-empty"
theme = "dark"
width = 1440
height = 900
gpui_keys = ["v c"]
prototype_steps = ["state.view='conflicts'", "mount()"]
measure = ["app", "nav", "main", "main-header"]

[[scene]]
name = "views-columns"
theme = "dark"
width = 1440
height = 900
gpui_keys = ["v o", "v l"]
prototype_steps = ["state.view='open'", "state.layout='board'", "mount()"]
measure = ["app", "nav", "main", "main-header"]

[[scene]]
name = "queue-filtered"
theme = "dark"
width = 1440
height = 900
gpui_keys = ["f x"]
prototype_steps = ["state.filters.deleted='show'", "mount()"]
measure = ["app", "nav", "main", "main-header"]

[[scene]]
name = "search-results"
theme = "dark"
width = 1440
height = 900
gpui_keys = ["/", "s y n c"]
prototype_steps = ["openSearch()", "const i=document.querySelector('.sr-top input');i.value='sync';i.dispatchEvent(new Event('input'))"]
measure = ["app", "nav", "main", "main-header"]

[[scene]]
name = "palette"
theme = "dark"
width = 1440
height = 900
gpui_keys = ["cmd-k"]
prototype_steps = ["palette()"]
measure = ["app", "nav", "main", "main-header"]

[[scene]]
name = "help"
theme = "dark"
width = 1440
height = 900
gpui_keys = ["?"]
prototype_steps = ["openHelp()"]
measure = ["app", "nav", "main", "main-header"]

[[scene]]
name = "composer"
theme = "dark"
width = 1440
height = 900
gpui_keys = ["a"]
prototype_steps = ["openComposer()"]
measure = ["app", "nav", "main", "main-header"]

[[scene]]
name = "composer-more"
theme = "dark"
width = 1440
height = 900
gpui_keys = ["a", "f i x space i t space # s y n c space ! h i g h"]
prototype_steps = ["openComposer({more:true})"]
gpui_click = [945.0, 195.0]
measure = ["app", "nav", "main", "main-header"]

[[scene]]
name = "composer-ai"
theme = "dark"
width = 1440
height = 900
gpui_keys = ["a", "ctrl-n"]
prototype_steps = ["openComposer()"]
measure = ["app", "nav", "main", "main-header"]

[[scene]]
name = "schedule"
theme = "dark"
width = 1440
height = 900
gpui_keys = ["e a"]
prototype_steps = ["openSchedule()"]
measure = ["app", "nav", "main", "main-header"]

[[scene]]
name = "menu-status"
theme = "dark"
width = 1440
height = 900
gpui_keys = ["s"]
