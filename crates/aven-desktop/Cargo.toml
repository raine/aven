[package]
name = "aven-desktop"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false
license = "MIT"

[target.'cfg(target_os = "macos")'.dependencies]
accesskit = "0.24"
anyhow = "1"
aven-core = { path = "../aven-core" }
aven-host = { path = "../aven-host" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gpui = { git = "https://github.com/zed-industries/zed", rev = "ba63a022c9a22ca66d68ef2a8f0bb9b5b0a9984d" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "ba63a022c9a22ca66d68ef2a8f0bb9b5b0a9984d", features = ["font-kit", "runtime_shaders"] }
image = { version = "0.25", default-features = false, features = ["png"] }
linkify = "0.11.0"
pulldown-cmark = "0.13"
qrcode = { version = "0.14.1", default-features = false }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.45", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
unicode-segmentation = "1"
zeroize = "1"

[target.'cfg(target_os = "macos")'.dev-dependencies]
aven-host = { path = "../aven-host", features = ["test-support"] }
tempfile = "3.14"
