[package]
name = "aven-desktop"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false
license = "MIT"

[[bin]]
name = "aven-desktop"
path = "src/main.rs"

[[bin]]
name = "aven-desktop-capture"
path = "src/bin/capture.rs"
required-features = ["capture"]

[features]
capture = [
    "aven-core/test-support",
    "dep:base64",
    "dep:image",
    "dep:tempfile",
    "gpui/test-support",
    "gpui_platform/test-support",
]

[dependencies]
accesskit = "0.24"
anyhow = "1"
aven-core = { path = "../aven-core" }
aven-host = { path = "../aven-host" }
base64 = { version = "0.22", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gpui = { git = "https://github.com/zed-industries/zed", rev = "ba63a022c9a22ca66d68ef2a8f0bb9b5b0a9984d" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "ba63a022c9a22ca66d68ef2a8f0bb9b5b0a9984d", features = ["font-kit", "runtime_shaders"] }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
libc = "0.2"
linkify = "0.11.0"
pulldown-cmark = "0.13"
qrcode = { version = "0.14.1", default-features = false }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1.3"
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = { version = "3.14", optional = true }
tokio = { version = "1.45", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "0.9"
unicode-segmentation = "1"
zeroize = "1"

[dev-dependencies]
aven-host = { path = "../aven-host", features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3.14"

[patch.crates-io]
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }

[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 2
debug = false

[workspace]
