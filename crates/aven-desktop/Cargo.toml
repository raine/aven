[package]
name = "aven-desktop"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false
license = "MIT"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
accesskit = "0.24"
anyhow = "1"
aven-core = { path = "../aven-core", version = "=0.1.40" }
aven-host = { path = "../aven-host", version = "=0.1.0" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gpui = { git = "https://github.com/zed-industries/zed", rev = "ba63a022c9a22ca66d68ef2a8f0bb9b5b0a9984d" }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
linkify = "0.11.0"
pulldown-cmark = "0.13"
qrcode = { version = "0.14.1", default-features = false }
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.45", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
unicode-segmentation = "1"
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "ba63a022c9a22ca66d68ef2a8f0bb9b5b0a9984d", features = ["font-kit", "runtime_shaders"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSBundle", "NSString"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNNotificationSettings", "UNUserNotificationCenter"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "ba63a022c9a22ca66d68ef2a8f0bb9b5b0a9984d", features = ["wayland", "x11"] }
raw-window-handle = "0.6"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dev-dependencies]
aven-host = { path = "../aven-host", version = "=0.1.0", features = ["test-support"] }
tempfile = "3.14"
