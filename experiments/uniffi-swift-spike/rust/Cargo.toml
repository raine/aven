[package]
name = "aven-interop-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[lib]
name = "aven_interop_spike"
crate-type = ["cdylib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/uniffi_bindgen.rs"

[dependencies]
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "time"] }
uniffi = { version = "=0.32.0", features = ["cli", "tokio"] }

[workspace]
